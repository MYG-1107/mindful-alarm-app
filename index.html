<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTimer - Meditation & Focus Alarm</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-container">
    <header>
      <h1>ZenTimer</h1>
      <p class="subtitle">Mindful background timer & alert system</p>
    </header>

    <section class="timer-card">
      <div class="time-input-group">
        <div class="input-field">
          <label for="hours">Hours</label>
          <input type="number" id="hours" min="0" max="23" value="0">
        </div>
        <span class="colon">:</span>
        <div class="input-field">
          <label for="minutes">Minutes</label>
          <input type="number" id="minutes" min="0" max="59" value="20">
        </div>
      </div>

      <div class="preset-buttons">
        <button class="btn-preset" data-mins="5">5m</button>
        <button class="btn-preset" data-mins="10">10m</button>
        <button class="btn-preset" data-mins="15">15m</button>
        <button class="btn-preset" data-mins="20">20m</button>
        <button class="btn-preset" data-mins="30">30m</button>
      </div>

      <div class="display-container">
        <div class="timer-display" id="display">20:00</div>
        <div class="status-badge" id="statusBadge">Ready</div>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary">Start</button>
        <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
        <button id="resetBtn" class="btn btn-danger">Reset</button>
      </div>

      <div class="settings-group">
        <label class="toggle-option">
          <input type="checkbox" id="voiceToggle" checked>
          <span>Voice Announcement</span>
        </label>
        <label class="toggle-option">
          <input type="checkbox" id="chimeToggle" checked>
          <span>Meditation Chime Sound</span>
        </label>
        <button id="notifyBtn" class="btn-link">Enable Desktop Notifications</button>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
